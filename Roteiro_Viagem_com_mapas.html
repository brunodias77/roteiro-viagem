<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roteiro da viagem · Madrid, Paris, Barcelona e Andorra</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800;112,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}
/* Layout: uma coluna estreita, estilo diagrama de metrô. Cada dia é uma linha com cor própria; as paradas são estações e a distância real entre elas define o comprimento do trecho no mapa de cima. */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --fg: #15222C;
  --muted: #5B6A74;
  --rule: #D9DFDB;
  --chip: #E6EBE8;
  --warn-bg: #FFF1D6;
  --warn-fg: #5A3B00;
  --warn-rule: #E8C77A;
  --l1: #6B3FA0;
  --l2: #1F78C8;
  --l3: #D8402A;
  --line: var(--l1);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171D; --surface: #17222A; --fg: #E8EEF0; --muted: #94A5AF; --rule: #2A3943; --chip: #223039;
    --warn-bg: #3A2E10; --warn-fg: #F6DDA0; --warn-rule: #6B5518;
    --l1: #B596EA; --l2: #6DB3F2; --l3: #FF8068;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171D; --surface: #17222A; --fg: #E8EEF0; --muted: #94A5AF; --rule: #2A3943; --chip: #223039;
  --warn-bg: #3A2E10; --warn-fg: #F6DDA0; --warn-rule: #6B5518;
  --l1: #B596EA; --l2: #6DB3F2; --l3: #FF8068;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; }
.kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: clamp(34px, 8vw, 52px); line-height: 1.02; margin: 6px 0 8px; letter-spacing: -.01em; text-wrap: balance; }
.base { color: var(--muted); margin: 0 0 22px; max-width: 52ch; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.tab {
  font: 600 14px var(--f-body); color: var(--fg); background: var(--chip);
  border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--line); color: var(--bg); }
.tab:focus-visible, a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.day.d1 { --line: var(--l1); }
.day.d2 { --line: var(--l2); }
.day.d3 { --line: var(--l3); }
.tab.t1[aria-selected="true"] { background: var(--l1); }
.tab.t2[aria-selected="true"] { background: var(--l2); }
.tab.t3[aria-selected="true"] { background: var(--l3); }

h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 24px; margin: 0 0 14px; text-wrap: balance; }

.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 20px; padding: 0; list-style: none; font-size: 14px; }
.facts li { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.facts b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.facts span { color: var(--muted); }

.map { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 16px 12px; margin-bottom: 26px; }
.map-title { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.strip { display: flex; align-items: center; }
.dot {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--line); color: var(--fg);
  display: grid; place-items: center; font: 600 11px var(--f-mono);
}
.strip.dense .dot { width: 19px; height: 19px; border-width: 2px; font-size: 9px; }
.seg { height: 5px; background: var(--line); min-width: 0; }
.seg.transit { background: repeating-linear-gradient(90deg, var(--line) 0 7px, transparent 7px 12px); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 26px; height: 5px; background: var(--line); vertical-align: middle; margin-right: 6px; }
.legend i.tr { background: repeating-linear-gradient(90deg, var(--line) 0 7px, transparent 7px 12px); }

.gmap { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.gmap-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; }
.gmap-head .map-title { margin: 0; }
.gmap-open { font: 600 13px var(--f-body); color: var(--bg); background: var(--line); border-radius: 999px; padding: 6px 14px; text-decoration: none; }
.gmap iframe { display: block; width: 100%; height: 360px; border: 0; border-block: 1px solid var(--rule); background: var(--chip); }
.gmap-key { list-style: none; margin: 0; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.gmap-key li { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.gmap-key b { font-family: var(--f-mono); font-weight: 600; color: var(--line); }
.seg-ctl { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
.seg-ctl button, .leg-chip, .leg-map { font: 600 13px var(--f-body); color: var(--fg); border: 0; cursor: pointer; }
.seg-ctl button { background: transparent; border-radius: 999px; padding: 6px 12px; }
.seg-ctl button[aria-pressed="true"] { background: var(--line); color: var(--bg); }
.leg-chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 12px; scrollbar-width: thin; }
.leg-chip { flex: none; background: var(--chip); border-radius: 8px; padding: 5px 10px; font-family: var(--f-mono); font-size: 12px; }
.leg-chip small { font-weight: 400; color: var(--muted); }
.leg-chip[aria-pressed="true"] { background: var(--line); color: var(--bg); }
.leg-chip[aria-pressed="true"] small { color: inherit; opacity: .85; }
.gmap-bar { display: flex; gap: 10px 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px 0; }
.gmap-cap { margin: 0; font-size: 13px; color: var(--muted); flex: 1 1 240px; }
.leg-map { background: transparent; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.seg-ctl button:focus-visible, .leg-chip:focus-visible, .leg-map:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.pdf-row { margin: -8px 0 18px; }
.dinfo .pdf-row { margin: 0 0 16px; }
.pdf-btn { font: 600 13px var(--f-body); color: var(--bg); background: var(--line); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.pdf-btn:disabled { opacity: .6; cursor: progress; }
.pdf-btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.pdf-stage { position: fixed; left: -10000px; top: 0; }
.pdf { width: 720px; background: #fff; color: #15222C; font: 13px/1.45 var(--f-body); padding: 4px 0; }
.pdf a { color: #1F5FA8; text-decoration: none; }
.pdf h1 { font: 700 24px/1.15 var(--f-display); font-stretch: 112%; margin: 2px 0 6px; color: #15222C; }
.pdf h2 { font: 700 15px var(--f-display); font-stretch: 112%; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--pl); color: #15222C; }
.pdf-k { font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #5B6A74; margin: 0; }
.pdf-f { margin: 0; color: #5B6A74; }
.pdf-stop { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.pdf-n { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--pl); display: grid; place-items: center; font: 700 10px var(--f-mono); color: #15222C; }
.pdf-stop p { margin: 0; }
.pdf-t { font-size: 14px; }
.pdf-t b { font-family: var(--f-mono); font-weight: 600; color: var(--pl); }
.pdf-m { font-size: 12px; color: #5B6A74; }
.pdf-x { margin-top: 2px !important; }
.pdf-leg { margin: 0 0 0 10px; padding: 4px 0 4px 21px; border-left: 2px dashed #C9D1CC; font-size: 12px; color: #3A4A55; }
.pdf-leg b { color: #15222C; font-weight: 600; }
.pdf ul { margin: 0; padding-left: 18px; }
.pdf li { margin: 0 0 5px; }
.pdf-alert { background: #FFF1D6; border: 1px solid #E8C77A; border-radius: 6px; padding: 7px 10px; margin: 0 0 6px; color: #5A3B00; }
.pdf-tab { border-collapse: collapse; width: 100%; }
.pdf-tab td { padding: 4px 8px 4px 0; border-bottom: 1px solid #E1E6E3; }
.pdf-tab td:nth-child(2), .pdf-tab td:nth-child(3) { font-family: var(--f-mono); white-space: nowrap; }
.pdf-tr { padding: 6px 0; }
.pdf-tr p { margin: 0; }
.pdf-img { text-align: center; padding: 6px 0 10px; }
.pdf-img img { width: 520px; border: 1px solid #E1E6E3; border-radius: 8px; }
.pdf-foot { margin-top: 18px; font-size: 11px; color: #5B6A74; }
@media print { .top, .tabs, .pdf-row, .gmap, .food, .map { display: none !important; } }
.pin-x { width: 28px; height: 28px; background: #fff; color: var(--pc); border: 2px solid var(--pc); font-size: 13px; }
.food-list .pin-x { border: 2px solid var(--pc); background: var(--surface); }
.extras { border-top: 1px solid var(--rule); padding-top: 12px; }
.extras .map-title { margin: 0 16px; }
.pin-f { width: 28px; height: 28px; border-radius: 8px; font-size: 12px; }
.food { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.food summary { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; padding: 12px 16px; cursor: pointer; list-style: none; }
.food summary::-webkit-details-marker { display: none; }
.food summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
.food[open] summary::before { transform: rotate(90deg); }
.food summary .map-title { margin: 0; }
.food-sum { font-size: 13px; color: var(--muted); }
.food summary:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; }
.food-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 0 16px 12px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip, .food-near { font: 600 12px var(--f-body); color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.fchip i { width: 10px; height: 10px; border-radius: 3px; }
.fchip small { color: var(--muted); font-weight: 500; }
.fchip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.food-near { background: var(--fg); color: var(--bg); }
.fchip:focus-visible, .food-near:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
#food-canvas { height: 340px; border-block: 1px solid var(--rule); background: var(--chip); z-index: 0; }
.food-status { margin: 0; padding: 8px 16px 0; font-size: 12px; color: var(--muted); }
.food-status:empty { display: none; }
.food-list { list-style: none; margin: 0; padding: 4px 16px 8px; }
.food-list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--rule); }
.food-list li:first-child { border-top: 0; }
.food-list li[hidden] { display: none; }
.food-list .pin { flex: none; box-shadow: none; border: 0; }
.food-list a { font-weight: 600; color: var(--fg); text-underline-offset: 3px; text-decoration-color: var(--rule); }
.fl-meta { display: block; font-size: 12px; color: var(--muted); }
.food-list p { margin: 2px 0 0; font-size: 13px; }
#gmap-canvas { height: 380px; border-block: 1px solid var(--rule); background: var(--chip); z-index: 0; }
.pin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--pc); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); font: 700 12px var(--f-mono); color: #fff; }
.pin-h { background: #15222C; }
.pin-air { background: #15222C; font-size: 15px; }
.map-view { display: inline-flex; gap: 4px; }
.map-view { padding: 0 16px 12px; }
.map-view button { font: 600 12px var(--f-body); color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.map-view button[aria-pressed="true"] { background: var(--line); color: var(--bg); }
.leaflet-popup-content { font: 14px var(--f-body); }
.metro { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px 4px; margin-bottom: 26px; }
.mt-list { list-style: none; margin: 0; padding: 0; }
.mt-row { padding: 12px 0; border-top: 1px solid var(--rule); }
.mt-row:first-child { border-top: 0; padding-top: 4px; }
.mt-head { display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; align-items: baseline; }
.mt-pair { font-weight: 600; }
.mt-pair b { font-family: var(--f-mono); color: var(--line); }
.mt-head a { font-size: 13px; color: var(--fg); font-weight: 600; text-underline-offset: 3px; }
.mt-rides { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.mt-rides li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.ln { flex: none; min-width: 38px; text-align: center; font: 700 12px var(--f-mono); padding: 2px 6px; border-radius: 6px; background: var(--c); color: #fff; }
.mt-dir { color: var(--muted); font-size: 13px; }
.mt-note, .mt-walk { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.mt-walk { display: flex; gap: 6px; align-items: flex-start; }
.mt-walk svg { width: 16px; height: 16px; flex: none; fill: currentColor; margin-top: 2px; }
.guide { display: block; margin-top: 10px; }
.guide img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 10px; }
.gmap-note { margin: 0; padding: 0 16px 12px; font-size: 12px; color: var(--muted); }

.tl { list-style: none; margin: 0; padding: 0; }
.node { position: relative; padding-left: 52px; }
.node::before { content: ""; position: absolute; left: 15px; top: 0; bottom: 0; width: 5px; background: var(--line); }
.node.first::before { top: 20px; }
.node.last::before { bottom: auto; height: 20px; }
.node.solo::before { display: none; }
.mark {
  position: absolute; left: 6px; top: 8px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--line);
  display: grid; place-items: center; font: 600 11px var(--f-mono);
}
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 0 0 0; min-width: 0; }
.card h3 { margin: 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; }
.tag { background: var(--chip); border-radius: 6px; padding: 2px 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
.hours { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.win { font-family: var(--f-mono); font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 6px; background: var(--line); color: var(--bg); }
.note { margin: 10px 0 0; max-width: 60ch; }

.leg { position: relative; padding: 9px 0 9px 52px; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.leg::before { content: ""; position: absolute; left: 15px; top: 0; bottom: 0; width: 5px; background: var(--line); }
.leg.transit::before { background: repeating-linear-gradient(180deg, var(--line) 0 7px, transparent 7px 12px); }
.leg svg { width: 16px; height: 16px; flex: none; fill: currentColor; }
.leg b { font-family: var(--f-mono); font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
.leg a { color: var(--fg); font-weight: 600; text-underline-offset: 3px; }

.alerts { margin-top: 28px; display: grid; gap: 10px; }
.alert { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-rule); border-radius: 10px; padding: 12px 14px; }
.alert strong { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.alert p { margin: 0; max-width: 62ch; }
.foot { margin-top: 32px; font-size: 12px; color: var(--muted); max-width: 62ch; }

@media (prefers-reduced-motion: no-preference) {
  .day { animation: in .25s ease-out; }
  @keyframes in { from { opacity: .0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
.ln[style*="FFD100"] { color: #15222C; }
.top { position: sticky; top: 0; z-index: 1000; background: var(--bg); margin: -28px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 22px; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 10px; border-bottom: 1px solid var(--rule); }
.top-in { max-width: 720px; margin: 0 auto; }
.trip { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.cities { display: flex; overflow-x: auto; scrollbar-width: none; gap: 4px; background: var(--chip); border-radius: 12px; padding: 4px; }
.city { flex: 1 0 auto; white-space: nowrap; font: 700 15px var(--f-display); font-stretch: 100%; color: var(--fg); background: transparent; border: 0; border-radius: 9px; padding: 8px 10px 6px; cursor: pointer; line-height: 1.15; min-width: 0; }
.city small { display: block; font: 500 11px var(--f-mono); color: var(--muted); margin-top: 2px; }
.city[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.city:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
@media (max-width: 440px) { .city { font-size: 13px; padding: 7px 7px 5px; } .city small { font-size: 10px; } }
.gmap-key a { color: var(--fg); text-underline-offset: 3px; text-decoration-color: var(--rule); }
.gmap-key a:hover { text-decoration-color: currentColor; }
.gmap-head { border-bottom: 1px solid var(--rule); }
.day.dinfo { --line: var(--fg); }
.tab.ti[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.tab.ti { display: inline-flex; gap: 6px; align-items: center; }
h2 .range { font: 500 12px var(--f-mono); color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 9px; vertical-align: middle; margin-left: 6px; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.info-card { padding: 4px 14px; margin-bottom: 16px; }
.sched { width: 100%; border-collapse: collapse; font-size: 14px; }
.sched th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 6px 8px; border-bottom: 1px solid var(--rule); }
.sched td { padding: 9px 6px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.sched tr:last-child td { border-bottom: 0; }
.sched td:first-child, .sched th:first-child { width: 28px; padding-left: 0; }
.sched td:nth-child(2) { font-weight: 600; }
.sched td:nth-child(3), .sched td:nth-child(4) { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sched td:nth-child(4) { font-weight: 500; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; color: var(--muted); }
.hotel { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.hotel-ico { width: 28px; height: 28px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.hotel-txt { flex: 1 1 200px; min-width: 0; }
.hotel-txt .map-title { margin: 0 0 2px; }
.hotel-txt strong { display: block; font-family: var(--f-display); font-stretch: 112%; font-size: 17px; }
.hotel-txt address { font-style: normal; font-size: 13px; color: var(--muted); }
.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 8px 0 0; }

    '<a class="gmap-open" href="' + gm(h.q) + '" target="_blank" rel="noopener">Ver no mapa ↗</a></div>';
  var tr = '<div class="metro"><p class="map-title">' + esc(I.trTitle) + '</p><ol class="mt-list">' + I.transfers.map(function (x) {

      '<a href="' + x.url + '" target="_blank" rel="noopener">' + (x.link || 'Trajeto no mapa ↗') + '</a></div>' +
      '<ol class="steps">' + x.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<p class="mt-note">' + esc(x.detail) + '</p>' +
      (x.img ? '<a class="guide" href="' + x.img + '" target="_blank" rel="noopener"><img src="' + x.img + '" alt="' + esc(x.alt || '') + '" loading="lazy"></a>' : '') + '</li>';
  }).join('') + '</ol></div>';
  var home = I.home ? '<div class="home">' + ico('plane', 'home-ico') + '<div class="home-txt"><span>' + esc(I.home.date) + '</span><strong>' + esc(I.home.title) + '</strong><p>' + esc(I.home.sub) + '</p><address>' + esc(I.home.addr) + '</address>' +
    '<a href="' + gm(I.home.q) + '" target="_blank" rel="noopener">Ver aeroporto no mapa ↗</a></div><div class="home-time"><span>Partida</span><b>' + esc(I.home.time) + '</b></div></div>' : '';
  var alerts = I.alerts ? '<div class="alerts">' + I.alerts.map(function (a) { return '<div class="alert"><strong>' + esc(a.t) + '</strong><p>' + esc(a.x) + '</p></div>'; }).join('') + '</div>' : '';
  var refs = C.foodRef ? [{ name: C.foodRef, c: C.COORD[C.foodRef] }] : [];
  document.getElementById('day').innerHTML = '<section class="day dinfo" id="panel" role="tabpanel"><h2>Horários e hospedagem <span class="range">' + esc(I.range) + '</span></h2>' +
    '<div class="pdf-row"><button type="button" class="pdf-btn" id="pdf-btn">⬇ Baixar PDF de horários e traslados</button></div>' +
    '<div class="card info-card">' + rows + '</div>' + hotel + foodHtml(refs) + tr + home + alerts + '</section>';
  foodWire(refs);
  document.getElementById('pdf-btn').addEventListener('click', function () {
    pdfDownload(this, pdfInfoHtml(refs), 'Traslados ' + C.tab);
  });
}

/* ================= RENDER ================= */
var C = CITIES[0];

function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : m + ' m'; }
function fmtTime(min) { var h = Math.floor(min / 60), r = min % 60; return h ? h + ' h' + (r ? ' ' + r + ' min' : '') : r + ' min'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function qOf(name) { return C.Q[name] || (name + ', ' + C.suffix); }

var ICON_WALK = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4.5" r="2"/><path d="M9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 14v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>';
var ICON_BUS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16c0 .9.4 1.7 1 2.2V20c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-1h8v1c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-1.8c.6-.5 1-1.3 1-2.2V6c0-3.5-3.6-4-8-4S4 2.5 4 6v10zm3.5 1c-.8 0-1.5-.7-1.5-1.5S6.7 14 7.5 14s1.5.7 1.5 1.5S8.3 17 7.5 17zm9 0c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5zM18 11H6V6h12v5z"/></svg>';

function dirUrl(a, b, mode) {
  return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(qOf(a)) +
    '&destination=' + encodeURIComponent(qOf(b)) + '&travelmode=' + (mode === BUS ? 'transit' : 'walking');
}

function routeUrl(nodes) {
  var names = [];
  nodes.forEach(function (nd) { if (names[names.length - 1] !== nd.name) names.push(nd.name); });
  var u = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(qOf(names[0])) +
    '&destination=' + encodeURIComponent(qOf(names[names.length - 1]));
  var mid = names.slice(1, -1);
  if (mid.length) u += '&waypoints=' + mid.map(function (n) { return encodeURIComponent(qOf(n)); }).join('%7C');
  return u;
}

/* Lugares "Se der tempo": fora dos horários do dia, mas perto da rota. Aparecem no mapa de pontos com estrela, sem trecho nem horário. */
function extrasHtml(d, refs) {
  if (!d.extra || !d.extra.length || !refs.length) return '';
  return '<div class="extras"><p class="map-title">Se der tempo · fora do roteiro</p><ol class="food-list">' + d.extra.map(function (x) {
    var best = null;
    refs.forEach(function (r) { var dd = distM(x.c, r.c); if (!best || dd < best.d) best = { d: dd, name: r.name }; });
    return { x: x, d: best.d, near: best.name };
  }).sort(function (a, b) { return a.d - b.d; }).map(function (e) {
    return '<li><span class="pin pin-x" style="--pc:var(--line)">★</span><div><a href="' + gm(e.x.q) + '" target="_blank" rel="noopener">' + esc(e.x.name) + '</a>' +
      '<span class="fl-meta">' + esc(e.x.tag) + ' · ' + walkLabel(e.d) + ' de ' + esc(e.near) + '</span>' +
      (e.x.note ? '<p>' + esc(e.x.note) + '</p>' : '') + '</div></li>';
  }).join('') + '</ol></div>';
}

function mviewHtml(far, extras) {
  if (!far && !extras) return '';
  var b = [['all', far ? 'Com Canillo' : 'Só o roteiro']];
  if (far) b.push(['city', 'Só a cidade']);
  if (extras) b.push(['extras', 'Com os extras ★']);
  return '<div class="map-view" role="group" aria-label="Enquadramento do mapa">' + b.map(function (x, i) {
    return '<button type="button" data-mview="' + x[0] + '" aria-pressed="' + (i === 0) + '">' + x[1] + '</button>';
  }).join('') + '</div>';
}

function gmapHtml(nodes, legs, dayId, extra, inside) {
  var info = C.METRO[dayId] || [];
  var seen = {};
  var key = '<ol class="gmap-key">' + nodes.map(function (nd) {
    if (nd.airport) return '';
    if (nd.label === 'H' && seen.H) return '';
    if (nd.label === 'H') seen.H = 1;
    var link = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(qOf(nd.name));
    return '<li><b>' + nd.label + '</b><a href="' + link + '" target="_blank" rel="noopener">' + esc(nd.name) + '</a></li>';
  }).join('') + '</ol>';

  var rows = legs.map(function (leg, i) {
    var a = nodes[i], b = nodes[i + 1], mm = info[i] || C.CURTO;
    var head = '<div class="mt-head"><span class="mt-pair"><b>' + a.label + '</b> → <b>' + b.label + '</b> ' + esc(b.name) + '</span>' +
      '<a href="' + dirUrl(a.name, b.name, BUS) + '" target="_blank" rel="noopener">Ver no Google Maps ↗</a></div>';
    var body;
    if (mm.walk) body = '<p class="mt-walk">' + ICON_WALK + '<span>' + esc(mm.txt) + '</span></p>';
    else body = (mm.pre ? '<p class="mt-note">' + esc(mm.pre) + '</p>' : '') + '<ol class="mt-rides">' + mm.rides.map(function (r) {
      return '<li><span class="ln" style="--c:' + C.LINE_COLOR[r[0]] + (C.DARK_TEXT[r[0]] ? ';color:#15222C' : '') + '">' + r[0] + '</span><span><b>' + esc(r[1]) + '</b> → <b>' + esc(r[2]) + '</b> · ' +
        (r[3] == null ? '' : r[3] + (r[3] === 1 ? ' parada' : ' paradas') + ' ') + '<span class="mt-dir">(' + esc(r[4]) + ')</span></span></li>';
    }).join('') + '</ol>' + (mm.post ? '<p class="mt-note">' + esc(mm.post) + '</p>' : '');
    return '<li class="mt-row' + (mm.walk ? ' is-walk' : '') + '">' + head + body + '</li>';
  }).join('');

  return '<div class="gmap"><div class="gmap-head"><p class="map-title">Pontos do dia</p>' +
    '<a class="gmap-open" href="' + routeUrl(nodes) + '" target="_blank" rel="noopener">Ver o dia no Google Maps ↗</a></div>' +
    mviewHtml(nodes.some(function (nd) { return nd.far; }), !!inside) +
    '<div id="gmap-canvas" role="img" aria-label="Mapa com as paradas do dia"></div>' + key + (inside || '') + '</div>' + (extra || '') +
    '<div class="metro"><p class="map-title">' + C.mode.title + '</p><ol class="mt-list">' + rows + '</ol>' +
    '<p class="gmap-note">' + esc(C.mode.note) + '</p></div>';
}

/* ================= ONDE COMER ================= */
/* Um mapa só por cidade, recolhido por padrão. Abre centrado na região do dia (refs), com a lista ordenada pela distância das paradas; "Perto de mim" reordena pela sua localização. */
var FOOD_TYPES = {
  rest: { label: 'Restaurantes', color: '#C0392B' },
  tapas: { label: 'Tapas e bares', color: '#7E3FA6' },
  rapido: { label: 'Lanches', color: '#B45309' },
  doce: { label: 'Doces e café', color: '#BE185D' },
  mercado: { label: 'Mercados', color: '#047857' },
  super: { label: 'Supermercados', color: '#1D4ED8' }
};
var foodOpen = false, foodOff = {}, foodLayers = {}, foodMe = null;

function distM(a, b) {
  var r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  var h = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
/* Linha reta × 1,3 ≈ caminho pelas ruas; 80 m por minuto a pé. */
function walkLabel(m) {
  var w = m * 1.3, min = Math.max(1, Math.round(w / 80));
  return min <= 40 ? '≈ ' + min + ' min a pé' : '≈ ' + fmtDist(Math.round(w / 100) * 100);
}
function foodLetter(i) { return String.fromCharCode(65 + i); }

function foodRank(refs) {
  return C.FOOD.map(function (f, i) {
    var best = null;
    refs.forEach(function (r) { var d = distM(f.c, r.c); if (!best || d < best.d) best = { d: d, name: r.name }; });
    return { f: f, i: i, d: best.d, near: best.name };
  }).sort(function (a, b) { return a.d - b.d; });
}

function foodItems(refs, me) {
  return foodRank(refs).map(function (x) {
    var t = FOOD_TYPES[x.f.type];
    return '<li data-ft="' + x.f.type + '"' + (foodOff[x.f.type] ? ' hidden' : '') + '><span class="pin pin-f" style="--pc:' + t.color + '">' + foodLetter(x.i) + '</span>' +
      '<div><a href="' + gm(x.f.q) + '" target="_blank" rel="noopener">' + esc(x.f.name) + '</a>' +
      '<span class="fl-meta">' + t.label + ' · ' + walkLabel(x.d) + (me ? ' de você' : ' de ' + esc(x.near)) + '</span>' +
      (x.f.note ? '<p>' + esc(x.f.note) + '</p>' : '') + '</div></li>';
  }).join('');
}

function foodHtml(refs) {
  if (!C.FOOD || !refs.length) return '';
  var used = {};
  C.FOOD.forEach(function (f) { used[f.type] = (used[f.type] || 0) + 1; });
  var chips = Object.keys(FOOD_TYPES).filter(function (k) { return used[k]; }).map(function (k) {
    return '<button type="button" class="fchip" data-ft="' + k + '" aria-pressed="' + !foodOff[k] + '"><i style="background:' + FOOD_TYPES[k].color + '"></i>' + FOOD_TYPES[k].label + ' <small>' + used[k] + '</small></button>';
  }).join('');
  return '<details class="food" id="food"' + (foodOpen ? ' open' : '') + '><summary><span class="map-title">Onde comer</span>' +
    '<span class="food-sum">' + C.FOOD.length + ' lugares · do mais perto ao mais longe' + (refs.length > 1 ? ' do roteiro do dia' : ' da hospedagem') + '</span></summary>' +
    '<div class="food-bar"><div class="fchips" role="group" aria-label="Filtrar por tipo">' + chips + '</div>' +
    '<button type="button" class="food-near" id="food-near">📍 Perto de mim</button></div>' +
    '<div id="food-canvas" role="img" aria-label="Mapa dos lugares para comer"></div>' +
    '<p class="food-status" id="food-status" aria-live="polite"></p>' +
    '<ol class="food-list" id="food-list">' + foodItems(refs) + '</ol></details>';
}

function foodApply() {
  Array.prototype.forEach.call(document.querySelectorAll('#food-list li'), function (li) { li.hidden = !!foodOff[li.getAttribute('data-ft')]; });
  if (!foodObj) return;
  Object.keys(foodLayers).forEach(function (k) {
    if (foodOff[k]) foodObj.removeLayer(foodLayers[k]); else foodLayers[k].addTo(foodObj);
  });
}

function foodMap(refs) {
  var el = document.getElementById('food-canvas');
  if (foodObj || !el) return;
  if (!window.L) { el.innerHTML = '<p class="gmap-note" style="padding:16px">Não foi possível carregar o mapa. Verifique a conexão com a internet.</p>'; return; }
  foodObj = baseMap(el); foodLayers = {}; foodMe = null;
  refs.forEach(function (r) {
    L.circleMarker(r.c, { radius: 5, color: '#fff', weight: 1.5, fillColor: '#8A97A0', fillOpacity: .9 }).addTo(foodObj).bindTooltip(r.name);
  });
  var view = refs.map(function (r) { return r.c; });
  C.FOOD.forEach(function (f, i) {
    var t = FOOD_TYPES[f.type];
    var icon = L.divIcon({ className: '', iconSize: [28, 28], iconAnchor: [14, 14],
      html: '<span class="pin pin-f" style="--pc:' + t.color + '">' + foodLetter(i) + '</span>' });
    L.marker(f.c, { icon: icon, title: f.name }).addTo(foodLayers[f.type] || (foodLayers[f.type] = L.layerGroup()))
      .bindPopup('<b>' + esc(f.name) + '</b><br>' + t.label + (f.note ? '<br>' + esc(f.note) : '') + '<br><a href="' + gm(f.q) + '" target="_blank" rel="noopener">Abrir no Google Maps</a>');
    if (refs.some(function (r) { return distM(f.c, r.c) < 700; })) view.push(f.c);
  });
  foodApply();
  foodObj.fitBounds(view, { padding: [36, 36], maxZoom: 16 });
}

function foodNear(refs) {
  var st = document.getElementById('food-status');
  if (!navigator.geolocation) { st.textContent = 'Este navegador não informa a localização.'; return; }
  st.textContent = 'Buscando sua localização…';
  navigator.geolocation.getCurrentPosition(function (p) {
    var me = [p.coords.latitude, p.coords.longitude];
    var nearest = Math.min.apply(null, C.FOOD.map(function (f) { return distM(f.c, me); }));
    if (nearest > 20000) { st.textContent = 'Você está longe de ' + C.suffix + ': a lista continua ordenada pelo roteiro.'; return; }
    document.getElementById('food-list').innerHTML = foodItems([{ name: 'você', c: me }], true);
    st.textContent = 'Lista ordenada pela distância até você.';
    if (foodObj) {
      if (foodMe) foodMe.remove();
      foodMe = L.circleMarker(me, { radius: 8, color: '#fff', weight: 3, fillColor: '#2563EB', fillOpacity: 1 }).addTo(foodObj).bindTooltip('Você');
      foodObj.setView(me, 16);
    }
  }, function () {
    st.textContent = 'Não consegui sua localização. Permita o acesso à localização no navegador e tente de novo.';
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

function foodWire(refs) {
  var box = document.getElementById('food');
  if (!box) return;
  box.addEventListener('toggle', function () { foodOpen = box.open; if (box.open) foodMap(refs); });
  if (box.open) foodMap(refs);
  Array.prototype.forEach.call(box.querySelectorAll('.fchip'), function (b) {
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-ft');
      foodOff[k] = !foodOff[k];
      b.setAttribute('aria-pressed', !foodOff[k]);
      foodApply();
    });
  });
  document.getElementById('food-near').addEventListener('click', function () { foodNear(refs); });
}

/* ================= PDF DO DIA ================= */
/* Gera no navegador um PDF só de texto (sem os mapas, cujas imagens do Google não podem ir para o arquivo), com o roteiro, os trajetos, os avisos e onde comer. A biblioteca só é baixada no primeiro clique. */
var PDF_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
var PDF_COLOR = { d1: '#6B3FA0', d2: '#1F78C8', d3: '#D8402A' };
var lastDay = null, pdfLoading = null;

function pdfLoad() {
  if (window.html2pdf) return Promise.resolve();
  if (!pdfLoading) pdfLoading = new Promise(function (ok, fail) {
    var s = document.createElement('script');
    s.src = PDF_LIB; s.onload = ok;
    s.onerror = function () { pdfLoading = null; fail(); };
    document.head.appendChild(s);
  });
  return pdfLoading;
}

function legText(mm) {
  if (mm.walk) return mm.txt;
  return (mm.pre ? mm.pre + ' ' : '') + mm.rides.map(function (r) {
    return r[0] + ': ' + r[1] + ' → ' + r[2] + (r[3] == null ? '' : ' (' + r[3] + (r[3] === 1 ? ' parada' : ' paradas') + ')') + ', ' + r[4];
  }).join('; ') + '.' + (mm.post ? ' ' + mm.post : '');
}

function pdfHtml(st) {
  var d = st.d, color = PDF_COLOR[d.cls] || '#15222C', info = C.METRO[d.id] || [];
  var a = function (q, t) { return '<a href="' + gm(q) + '">' + esc(t) + '</a>'; };
  var h = '<div class="pdf" style="--pl:' + color + '">' +
    '<p class="pdf-k">Roteiro da viagem · ' + esc(C.tab) + ' · ' + esc(C.kicker) + '</p>' +
    '<h1>' + esc(d.title) + '</h1><p class="pdf-f">' + esc(st.facts) + '</p>' +
    '<h2>Roteiro</h2>';
  st.nodes.forEach(function (nd, i) {
    h += '<div class="pdf-stop pdf-avoid"><span class="pdf-n">' + esc(nd.label) + '</span><div>' +
      '<p class="pdf-t">' + (nd.win ? '<b>' + esc(nd.win) + '</b> · ' : '') + (nd.airport ? esc(nd.name) : a(qOf(nd.name), nd.name)) + '</p>' +
      '<p class="pdf-m">' + esc(nd.tag) + (nd.hours ? ' · ' + esc(nd.hours) : '') + '</p>' +
      (nd.note ? '<p class="pdf-x">' + esc(nd.note) + '</p>' : '') + '</div></div>';
    var leg = st.legs[i];
    if (leg && st.nodes[i + 1]) {
      h += '<div class="pdf-leg pdf-avoid"><b>' + (leg.approx ? '≈ ' : '') + fmtTime(leg.min) + ' · ' + fmtDist(leg.m) + ' ' + (leg.mode === BUS ? C.mode.leg : 'a pé') + '</b> — ' +
        esc(legText(info[i] || C.CURTO)) + '</div>';
    }
  });
  if (d.extra && d.extra.length) {
    h += '<h2>Se der tempo</h2><ul>' + d.extra.map(function (x) {
      return '<li class="pdf-avoid">' + a(x.q, x.name) + ' — ' + esc(x.tag) + (x.note ? '. ' + esc(x.note) : '') + '</li>';
    }).join('') + '</ul>';
  }
  if (d.alerts && d.alerts.length) {
    h += '<h2>Avisos</h2>' + d.alerts.map(function (al) {
      return '<div class="pdf-alert pdf-avoid"><b>' + esc(al.t) + '.</b> ' + esc(al.x) + '</div>';
    }).join('');
  }
  if (C.FOOD) {
    h += '<h2>Onde comer · do mais perto ao mais longe do roteiro</h2><ul>' + foodRank(st.refs).map(function (x) {
      return '<li class="pdf-avoid">' + a(x.f.q, x.f.name) + ' — ' + FOOD_TYPES[x.f.type].label + ' · ' + walkLabel(x.d) + ' de ' + esc(x.near) + (x.f.note ? '. ' + esc(x.f.note) : '') + '</li>';
    }).join('') + '</ul>';
  }
  return h + '<p class="pdf-foot">Os nomes em azul abrem no Google Maps. Confira ingressos e horários no site de cada lugar antes de ir.</p></div>';
}

/* Aba "Hotel e traslados": horários, hospedagem, traslados (com os guias em imagem quando o site está num servidor; aberto como arquivo local, o navegador não deixa copiar as imagens), avisos e onde comer perto da hospedagem. */
function pdfInfoHtml(refs) {
  var I = C.info, h = I.hotel;
  var a = function (q, t) { return '<a href="' + gm(q) + '">' + esc(t) + '</a>'; };
  var imgs = /^https?:/.test(location.protocol);
  var out = '<div class="pdf" style="--pl:#15222C">' +
    '<p class="pdf-k">Roteiro da viagem · ' + esc(C.tab) + ' · ' + esc(I.range) + '</p>' +
    '<h1>Horários, hospedagem e traslados</h1>' +
    '<h2>Horários</h2><table class="pdf-tab">' + I.rows.map(function (r) {
      return '<tr><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td><b>' + esc(r[3]) + '</b></td></tr>';
    }).join('') + '</table>' +
    '<h2>' + esc(h.over || ('Hospedagem em ' + C.tab)) + '</h2><p class="pdf-t">' + a(h.q, h.name) + '</p><p class="pdf-m">' + esc(h.addr) + '</p>' +
    '<h2>' + esc(I.trTitle) + '</h2>';
  I.transfers.forEach(function (x) {
    out += '<div class="pdf-avoid pdf-tr"><p class="pdf-t"><b>' + esc(x.date) + '</b> · <a href="' + x.url + '">' + esc(x.title) + '</a></p>' +
      '<p class="pdf-m">' + x.steps.map(esc).join(' → ') + '</p><p class="pdf-x">' + esc(x.detail) + '</p></div>';
    if (x.img && imgs) out += '<div class="pdf-avoid pdf-img"><img src="' + x.img + '" alt=""></div>';
  });
  if (I.home) {
    out += '<h2>' + esc(I.home.title) + ' · ' + esc(I.home.time) + '</h2><p>' + esc(I.home.date) + '. ' + esc(I.home.sub) + '</p><p class="pdf-m">' + a(I.home.q, I.home.addr) + '</p>';
  }
  if (I.alerts && I.alerts.length) {
    out += '<h2>Avisos</h2>' + I.alerts.map(function (al) {
      return '<div class="pdf-alert pdf-avoid"><b>' + esc(al.t) + '.</b> ' + esc(al.x) + '</div>';
    }).join('');
  }
  if (C.FOOD && refs.length) {
    out += '<h2>Onde comer · do mais perto ao mais longe da hospedagem</h2><ul>' + foodRank(refs).map(function (x) {
      return '<li class="pdf-avoid">' + a(x.f.q, x.f.name) + ' — ' + FOOD_TYPES[x.f.type].label + ' · ' + walkLabel(x.d) + (x.f.note ? '. ' + esc(x.f.note) : '') + '</li>';
    }).join('') + '</ul>';
  }
  return out + '<p class="pdf-foot">Os nomes em azul abrem no Google Maps.' + (imgs || !I.transfers.some(function (x) { return x.img; }) ? '' : ' Os guias ilustrados dos traslados estão no site.') + '</p></div>';
}

function pdfDownload(btn, html, name) {
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Gerando PDF…';
  var done = function () { btn.disabled = false; btn.textContent = label; };
  pdfLoad().then(function () {
    var box = document.createElement('div');
    box.className = 'pdf-stage';
    box.innerHTML = html;
    document.body.appendChild(box);
    var file = name.replace(/[\/\s]+/g, '-') + '.pdf';
    return html2pdf().set({
      margin: [12, 12, 14, 12], filename: file,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: '.pdf-avoid' }
    }).from(box.firstChild).save().then(function () { box.remove(); }, function (e) { box.remove(); throw e; });
  }).then(done, function () {
    done();
    alert('Não foi possível gerar o PDF agora (precisa de internet na primeira vez). A janela de impressão vai abrir: escolha “Salvar como PDF”.');
    window.print();
  });
}

var gmapObj = null, foodObj = null;
function gmapDestroy() {
  if (gmapObj) { gmapObj.remove(); gmapObj = null; }
  if (foodObj) { foodObj.remove(); foodObj = null; }
}
function baseMap(el) {
  var map = L.map(el, { scrollWheelZoom: false, attributionControl: true });
  L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=pt-BR&x={x}&y={y}&z={z}', { subdomains: '0123', maxZoom: 20, attribution: 'Mapa © Google' }).addTo(map);
  return map;
}
function gmapInit(nodes, extras) {
  gmapDestroy();
  var el = document.getElementById('gmap-canvas');
  if (!el) return;
  if (!window.L) { el.innerHTML = '<p class="gmap-note" style="padding:16px">Não foi possível carregar o mapa. Verifique a conexão com a internet e recarregue a página.</p>'; return; }
  var color = getComputedStyle(el).getPropertyValue('--line').trim() || '#6B3FA0';
  gmapObj = baseMap(el);
  var pts = [], cityPts = [], done = {};
  nodes.forEach(function (nd) {
    var c = C.COORD[nd.name];
    if (!c || done[nd.name]) return;
    done[nd.name] = 1; pts.push(c);
    if (!nd.airport && !nd.far) cityPts.push(c);
    var isH = nd.hostel;
    var icon = L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
      html: '<span class="pin' + (isH ? ' pin-h' : '') + '" style="--pc:' + color + '">' + (isH ? 'H' : nd.label) + '</span>' });
    var link = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(qOf(nd.name));
    L.marker(c, { icon: icon, title: nd.name }).addTo(gmapObj)
      .bindPopup('<b>' + esc(nd.name) + '</b><br><a href="' + link + '" target="_blank" rel="noopener">Abrir no Google Maps</a>');
  });
  var extraPts = pts.slice();
  (extras || []).forEach(function (x) {
    extraPts.push(x.c);
    var icon = L.divIcon({ className: '', iconSize: [28, 28], iconAnchor: [14, 14],
      html: '<span class="pin pin-x" style="--pc:' + color + '">★</span>' });
    L.marker(x.c, { icon: icon, title: x.name }).addTo(gmapObj)
      .bindPopup('<b>' + esc(x.name) + '</b><br>Se der tempo · ' + esc(x.tag) + '<br><a href="' + gm(x.q) + '" target="_blank" rel="noopener">Abrir no Google Maps</a>');
  });
  var views = { all: pts, city: cityPts, extras: extraPts };
  gmapObj.fitBounds(pts, { padding: [44, 44], maxZoom: 17 });
  Array.prototype.forEach.call(document.querySelectorAll('[data-mview]'), function (b) {
    b.addEventListener('click', function () {
      gmapObj.fitBounds(views[b.getAttribute('data-mview')], { padding: [44, 44], maxZoom: 17 });
      Array.prototype.forEach.call(document.querySelectorAll('[data-mview]'), function (o) { o.setAttribute('aria-pressed', o === b); });
    });
  });
}

function legHtml(leg, from, to) {
  var label = leg.mode === BUS ? C.mode.leg : 'a pé';
  return '<li class="leg ' + leg.mode + '">' + (leg.mode === BUS ? ICON_BUS : ICON_WALK) +
    '<span>' + (leg.approx ? '≈ ' : '') + '<b>' + fmtTime(leg.min) + '</b> · <b>' + fmtDist(leg.m) + '</b> ' + label + '</span>' +
    '<a href="' + dirUrl(from, to, leg.mode) + '" target="_blank" rel="noopener">Direções</a>' +
    (leg.mode === BUS ? '' : '<a href="' + dirUrl(from, to, BUS) + '" target="_blank" rel="noopener">' + C.mode.alt + '</a>') +
    '</li>';
}

function renderDay(idx) {
  var d = C.DAYS[idx];
  var nodes = [];
  if (d.origin) nodes.push({ name: d.origin.name, label: 'H', tag: d.origin.tag, note: d.origin.note, hostel: true, origin: true });
  d.stops.forEach(function (s) { nodes.push(Object.assign({}, s)); });
  if (d.end) nodes.push({ name: d.end.name, label: 'H', tag: 'Retorno', hostel: true, end: true, note: d.end.note });
  var legs = [];
  for (var i = 1; i < nodes.length; i++) legs.push(d.legs[d.origin ? i - 1 : i] || null);
  if (d.end) legs[legs.length - 1] = d.end.leg;
  var k = 0;
  nodes.forEach(function (nd) { if (nd.airport) nd.label = '✈'; else if (!nd.hostel) { k += 1; nd.label = String(k); } else nd.label = 'H'; });

  var walkM = 0, walkMin = 0, busM = 0, busMin = 0, approx = false;
  legs.forEach(function (l) {
    if (!l) return;
    if (l.mode === BUS) { busM += l.m; busMin += l.min; } else { walkM += l.m; walkMin += l.min; }
    if (l.approx) approx = true;
  });
  var ap = approx ? '≈ ' : '';

  var facts = '<ul class="facts">' +
    '<li><b>' + d.stops.filter(function (s) { return !s.hostel && !s.airport; }).length + '</b><span>paradas</span></li>' +
    '<li><b>' + ap + fmtDist(walkM) + '</b><span>a pé · ' + ap + fmtTime(walkMin) + '</span></li>' +
    (busM ? '<li><b>' + fmtDist(busM) + '</b><span>' + C.mode.facts + ' · ' + fmtTime(busMin) + '</span></li>' : '') +
    '</ul>';

  var strip = '<div class="strip' + (nodes.length > 11 ? ' dense' : '') + '">';
  nodes.forEach(function (nd, i) {
    strip += '<span class="dot" title="' + esc(nd.name) + '">' + nd.label + '</span>';
    if (legs[i]) strip += '<span class="seg ' + legs[i].mode + '" style="flex:' + legs[i].m + ' 1 12px" title="' + fmtDist(legs[i].m) + '"></span>';
  });
  strip += '</div>';
  var map = '<div class="map"><p class="map-title">Distâncias na escala do trajeto</p>' + strip +
    '<div class="legend"><span><i></i>a pé</span>' + (busM ? '<span><i class="tr"></i>' + C.mode.legend + '</span>' : '') + '<span>Comprimento proporcional à distância</span></div></div>';

  var tl = '<ol class="tl">';
  nodes.forEach(function (nd, i) {
    var cls = 'node' + (i === 0 ? ' first' : '') + (i === nodes.length - 1 ? ' last' : '');
    var meta = '<span class="tag">' + esc(nd.tag) + '</span>' +
      (nd.hours ? '<span class="hours">' + esc(nd.hours) + '</span>' : '') +
      (nd.win ? '<span class="win">' + esc(nd.win) + '</span>' : '');
    if (i > 0 && legs[i - 1]) tl += legHtml(legs[i - 1], nodes[i - 1].name, nd.name);
    tl += '<li class="' + cls + '"><span class="mark">' + nd.label + '</span><div class="card"><h3>' + esc(nd.name) + '</h3><div class="meta">' + meta + '</div>' +
      (nd.note ? '<p class="note">' + esc(nd.note) + '</p>' : '') + '</div></li>';
  });
  tl += '</ol>';

  var refs = [], seenRef = {};
  nodes.forEach(function (nd) { var c = C.COORD[nd.name]; if (c && !seenRef[nd.name]) { seenRef[nd.name] = 1; refs.push({ name: nd.name, c: c }); } });

  var alerts = d.alerts && d.alerts.length ? '<div class="alerts">' + d.alerts.map(function (a) {
    return '<div class="alert"><strong>' + esc(a.t) + '</strong><p>' + esc(a.x) + '</p></div>';
  }).join('') + '</div>' : '';

  lastDay = { d: d, nodes: nodes, legs: legs, refs: refs,
    facts: d.stops.filter(function (s) { return !s.hostel && !s.airport; }).length + ' paradas · ' + ap + fmtDist(walkM) + ' a pé (' + ap + fmtTime(walkMin) + ')' +
      (busM ? ' · ' + fmtDist(busM) + ' ' + C.mode.facts + ' (' + fmtTime(busMin) + ')' : '') };
  var pdfBtn = '<div class="pdf-row"><button type="button" class="pdf-btn" id="pdf-btn">⬇ Baixar PDF do dia</button></div>';

  document.getElementById('day').innerHTML = '<section class="day ' + d.cls + '" id="panel" role="tabpanel"><h2>' + d.title + '</h2>' + facts + pdfBtn + gmapHtml(nodes, legs, d.id, foodHtml(refs), extrasHtml(d, refs)) + map + tl + alerts + '</section>';
  gmapInit(nodes, d.extra);
  document.getElementById('pdf-btn').addEventListener('click', function () {
    pdfDownload(this, pdfHtml(lastDay), 'Roteiro ' + C.tab + ' ' + lastDay.d.tab);
  });
  foodWire(refs);

}

var shownCity = null;
function selectTab(n) {
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'), function (b, j) { b.setAttribute('aria-selected', j === n ? 'true' : 'false'); });
}
function renderCity(ci, di) {
  C = CITIES[ci];
  if (shownCity !== C.id) {
    shownCity = C.id;
    document.getElementById('head').innerHTML =
      '<div class="kicker">' + esc(C.kicker) + '</div><h1>' + esc(C.title) + '</h1><p class="base">' + esc(C.base) + '</p>';
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    var ib = document.createElement('button');
    ib.className = 'tab ti'; ib.type = 'button'; ib.setAttribute('role', 'tab');
    ib.textContent = C.DAYS.length ? 'Hotel e traslados' : 'Horários e traslados';
    ib.addEventListener('click', function () { location.hash = C.id + '-info'; });
    tabs.appendChild(ib);
    C.DAYS.forEach(function (d, i) {
      var b = document.createElement('button');
      b.className = 'tab t' + (i + 1);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.textContent = d.tab;
      b.addEventListener('click', function () { location.hash = C.id + '-' + d.id; });
      tabs.appendChild(b);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.city'), function (b, j) {
      b.setAttribute('aria-selected', j === ci ? 'true' : 'false');
    });
  }
  if (di < 0) { renderInfo(); selectTab(0); }
  else { renderDay(di); selectTab(di + 1); }
}

function route() {
  var h = (location.hash || '').replace('#', '');
  var ci = 0, di = -1;
  for (var i = 0; i < CITIES.length; i++) if (h === CITIES[i].id || h.indexOf(CITIES[i].id + '-') === 0) ci = i;
  var rest = h.slice(CITIES[ci].id.length + 1);
  var days = CITIES[ci].DAYS;
  for (var j = 0; j < days.length; j++) if (days[j].id === rest) di = j;
  var changedCity = shownCity !== CITIES[ci].id;
  renderCity(ci, di);
  if (changedCity && h) window.scrollTo(0, 0);
}

(function init() {
  var bar = document.getElementById('cities');
  CITIES.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'city';
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.innerHTML = esc(c.tab) + '<small>' + esc(c.short) + '</small>';
    b.addEventListener('click', function () { location.hash = c.id + '-info'; });
    bar.appendChild(b);
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script></body></html>
